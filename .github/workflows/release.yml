name: Release and container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.2); leave blank for a snapshot image"
        required: false
        default: "v1.0.2"
        type: string
      publish_release:
        description: "Create or update a GitHub Release with source archives"
        required: true
        default: true
        type: boolean
      push_image:
        description: "Build and push the container image to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  # GHCR repository names are lowercase even though GitHub's repository path
  # keeps the original casing.
  IMAGE_NAME: ghcr.io/autumnsentiment/trae2api-cn

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  release:
    name: Package and publish release
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release &&
      inputs.version != '')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            tag="${DISPATCH_VERSION}"
          else
            echo "A release version is required for a release run." >&2
            exit 1
          fi
          tag="${tag#v}"
          tag="$(RELEASE_VERSION="${tag}" python -c 'import os; from scripts.package_source import normalize_version; print(normalize_version(os.environ["RELEASE_VERSION"]))')"
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${tag}" >> "${GITHUB_OUTPUT}"
      - name: Build source archives
        run: |
          python scripts/package_source.py \
            --version "${{ steps.version.outputs.version }}" \
            --ref "${GITHUB_SHA}" \
            --output dist
      - name: Upload source archives as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trae-cn-relay-${{ steps.version.outputs.version }}-source
          path: dist/*
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            if [[ -f "docs/release-${RELEASE_TAG}.md" ]]; then
              gh release edit "${RELEASE_TAG}" --notes-file "docs/release-${RELEASE_TAG}.md"
            fi
          else
            notes=(--generate-notes)
            if [[ -f "docs/release-${RELEASE_TAG}.md" ]]; then
              notes=(--notes-file "docs/release-${RELEASE_TAG}.md")
            fi
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Trae2api-cn ${RELEASE_TAG}" \
              "${notes[@]}"
          fi

  image:
    name: Build and publish container image
    needs: [test, release]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve image version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ inputs.publish_release }}" == "true" && -n "${DISPATCH_VERSION}" ]]; then
            version="${DISPATCH_VERSION#v}"
          else
            version="snapshot-${GITHUB_SHA::7}"
          fi
          if [[ "${version}" != snapshot-* ]]; then
            version="$(RELEASE_VERSION="${version}" python -c 'import os; from scripts.package_source import normalize_version; print(normalize_version(os.environ["RELEASE_VERSION"]))')"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
            type=sha,prefix=sha-
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELAY_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
